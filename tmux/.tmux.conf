set -g set-clipboard on
set -g history-limit 100000

# Default-terminal must advertise 256-color + RGB so nvim/themes render right
# inside tmux. tmux-256color is the modern choice; fall back to screen-256color
# if the terminfo entry isn't present on the host.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"
